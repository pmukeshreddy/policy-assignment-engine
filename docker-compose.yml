services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: policy
      POSTGRES_PASSWORD: policy
      POSTGRES_DB: policy_engine
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policy -d policy_engine"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - policy-postgres:/var/lib/postgresql/data

  migrate:
    build: .
    command: npm run db:migrate:start
    environment:
      DATABASE_URL: postgres://policy:policy@postgres:5432/policy_engine
    depends_on:
      postgres:
        condition: service_healthy

  seed-demo:
    build: .
    command: npm run seed:demo:start
    environment:
      DATABASE_URL: postgres://policy:policy@postgres:5432/policy_engine
      LOG_LEVEL: warn
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    build: .
    command: npm start
    environment:
      DATABASE_URL: postgres://policy:policy@postgres:5432/policy_engine
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      seed-demo:
        condition: service_completed_successfully

  worker:
    build: .
    command: npm run worker:start
    environment:
      DATABASE_URL: postgres://policy:policy@postgres:5432/policy_engine
    depends_on:
      seed-demo:
        condition: service_completed_successfully

volumes:
  policy-postgres:
