<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8f6" />
    <title>Policy Assignment</title>
    <link rel="stylesheet" href="/admin/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
        <div class="brand-row">
          <div class="product-mark" aria-hidden="true"><span></span><span></span><span></span></div>
          <div class="brand-copy"><strong>Policy Assignment</strong><span>Policy decisions</span></div>
          <button class="icon-button sidebar-close" id="sidebar-close" aria-label="Close navigation"></button>
        </div>
        <div class="workspace-switcher">
          <label for="company">Workspace</label>
          <div class="select-wrap"><select id="company" aria-label="Current company"></select><span data-icon="chevrons"></span></div>
        </div>
        <nav id="primary-nav"></nav>
        <div class="sidebar-footer">
          <div class="system-state"><span class="health-dot" id="health-dot"></span><span><strong id="health-label">Checking system</strong><small>Assignments stay up to date</small></span></div>
        </div>
      </aside>
      <button class="sidebar-scrim" id="sidebar-scrim" aria-label="Close navigation"></button>

      <section class="workspace">
        <header class="app-header">
          <div class="header-left">
            <button class="icon-button sidebar-trigger" id="sidebar-trigger" aria-label="Open navigation"></button>
            <div class="breadcrumbs" id="breadcrumbs" aria-label="Breadcrumb"></div>
          </div>
          <div class="header-actions">
            <button class="command-trigger" id="command-trigger"><span data-icon="search"></span><span>Search or jump to…</span><kbd>⌘ K</kbd></button>
            <button class="icon-button" id="refresh-view" aria-label="Refresh current page"></button>
          </div>
        </header>
        <main id="main-content" tabindex="-1"><div class="page-loading" aria-label="Loading"><span></span><span></span><span></span></div></main>
      </section>
    </div>

    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>

    <dialog class="modal" id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
    <dialog class="drawer" id="drawer" aria-labelledby="drawer-title"><div id="drawer-content"></div></dialog>
    <dialog class="drawer inspector" id="inspector" aria-labelledby="inspector-title"><div id="inspector-content"></div></dialog>
    <dialog class="command-dialog" id="command-dialog" aria-labelledby="command-title">
      <div class="command-search"><span data-icon="search"></span><input id="command-input" aria-label="Search commands" placeholder="Search pages and actions" autocomplete="off" /></div>
      <div id="command-results" role="listbox"></div>
      <footer><span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></footer>
    </dialog>
    <dialog class="confirm-dialog" id="confirm-dialog" aria-labelledby="confirm-title">
      <form method="dialog">
        <div class="confirm-icon" id="confirm-icon"></div>
        <h2 id="confirm-title"></h2>
        <p id="confirm-message"></p>
        <div class="dialog-actions"><button value="cancel">Cancel</button><button class="button-danger" value="confirm" id="confirm-action">Confirm</button></div>
      </form>
    </dialog>

    <script type="module" src="/admin/app.js"></script>
  </body>
</html>
